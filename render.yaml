services:
  - type: web
    name: forgemind-backend
    env: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET
        value: forgemind_sentinel_access_jwt_secret_key_2026
      - key: JWT_REFRESH_SECRET
        value: forgemind_sentinel_refresh_jwt_secret_key_2026

  - type: web
    name: forgemind-frontend
    env: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
